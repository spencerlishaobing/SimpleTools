<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TVBOX · 手机配置</title>
<style>body{font:16px/1.7 system-ui;background:#10151f;color:#eef2fa;margin:0;padding:30px 20px}main{max-width:520px;margin:auto}small,p{color:#aab6c9}textarea,input,button{box-sizing:border-box;width:100%;border:1px solid #384459;border-radius:12px;padding:14px;background:#1c2636;color:inherit;font:inherit;margin:8px 0}textarea{height:190px}button{background:#4579eb;border:0;font-weight:600}button:disabled{opacity:.5}#status{white-space:pre-wrap}</style>
<main><small>SIMPLETOOLS</small><h1>TVBOX 手机配置</h1><p>手机和电脑连接同一个网络。输入配置网址，或粘贴配置内容，发送后电脑会自动加载。</p><form><label for="config">配置网址 / JSON</label><textarea id="config" required placeholder="https://… 或 { &quot;sites&quot;: […] }"></textarea><label for="file">也可以选择 JSON 配置文件</label><input id="file" type="file" accept=".json,application/json"><button id="send">发送到电脑</button></form><p id="status" role="status"></p></main>
<script>const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const status=document.getElementById('status'),button=document.getElementById('send'),input=document.getElementById('config');if(!token){button.disabled=true;status.textContent='请扫描电脑 TVBOX 设置中的二维码打开此页面。'}document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>1048576){status.textContent='文件不能超过 1 MB';return;}input.value=await f.text();};document.querySelector('form').onsubmit=async e=>{e.preventDefault();button.disabled=true;status.textContent='正在发送…';try{const r=await fetch('/config',{method:'POST',headers:{'X-TVBOX-Token':token,'Content-Type':'text/plain'},body:input.value});status.textContent=await r.text();}catch(e){status.textContent='无法连接电脑，请确认同一网络，并在电脑上重新开启扫码配置。';}finally{button.disabled=false;}};</script></html>
