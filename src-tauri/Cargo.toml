[package]
name = "simpletools"
version = "0.10.0"
description = "SimpleTools - 常用工具合集"
authors = ["SimpleTools"]
edition = "2021"

[lib]
name = "simpletools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
