[package]
name = "simpletools"
version = "0.35.2"
description = "SimpleTools - 常用工具合集"
authors = ["SimpleTools"]
edition = "2021"

[lib]
name = "simpletools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 数据导入导出（v0.30.0）：ZIP 打包 / 解包（deflate 压缩，无 C 依赖）
zip = { version = "2", default-features = false, features = ["deflate"] }

# 抓包（v0.35.0）：MITM HTTP/S 代理（rcgen 动态签发域名证书 + rustls/hyper）
# 0.22 使用 ring（无需 cmake / nasm）；0.23+ 切换 aws-lc-rs 会要求 CMake 工具链
hudsucker = "=0.22.0"
http-body-util = "0.1"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt"] }

# 抓包：枚举本机局域网 IPv4（供手机代理设置显示）
local-ip-address = "0.6"

# 抓包：记录正文时解压（gzip / deflate / brotli，均为纯 Rust 实现）
flate2 = "1"
brotli = "8"

# Windows Hello 身份校验（v0.19.0）：UserConsentVerifier + IUserConsentVerifierInterop
# （版本与 tauri 间接依赖的 windows 0.62 / windows-future 0.3 保持一致，共享 HWND 类型）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
