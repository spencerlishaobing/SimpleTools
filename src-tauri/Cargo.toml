[package]
name = "simpletools"
version = "0.21.0"
description = "SimpleTools - 常用工具合集"
authors = ["SimpleTools"]
edition = "2021"

[lib]
name = "simpletools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows Hello 身份校验（v0.19.0）：UserConsentVerifier + IUserConsentVerifierInterop
# （版本与 tauri 间接依赖的 windows 0.62 / windows-future 0.3 保持一致，共享 HWND 类型）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
